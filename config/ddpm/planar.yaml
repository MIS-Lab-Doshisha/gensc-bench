dataset:
  type: synthetic
  path: data/binary/raw/planar_dfs_adj_matrix_all.npz
  size: 64

model:
  timesteps: 1000
  input_dim: 1
  output_dim: 1
  base_ch: 24
  embedding_dim: 256

training:
  batch_size: 64
  num_epoch_optim: 500
  num_epoch_final: 1000
  n_trials: 100
  seed: 42
  runs:
  - seed: 43
    fold: 1
  - seed: 44
    fold: 2
  - seed: 45
    fold: 3

output:
  path: checkpoints/fix/planar/ddpm